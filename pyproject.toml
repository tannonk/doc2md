[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2md"]

[project]
name = "doc2md"
version = "0.1.0"
description = "PDF/Office to markdown conversion with a VLM OCR model, image cropping and image captioning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "tqdm>=4.70",
    "requests>=2.34.2",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "pdf2image>=1.17.0",
    "pillow>=12.3",
    "firecrawl-anydoc>=0.2.4",
    "litellm==1.98.0",
    "instructor>=1.15",
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.16.6",
    "pre-commit>=4.6.2",
    "python-docx>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["vllm: needs a live vLLM server (skipped when none is reachable)"]